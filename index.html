<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An elegant Rock Paper Scissors game built with HTML, CSS and JavaScript.">
    <meta name="theme-color" content="#0b0b14">
    <title>Rock Paper Scissors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated background -->
    <div class="bg" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <main class="app">

        <header class="intro">
            <p class="eyebrow">Best of luck</p>
            <h1>Rock <span>Paper</span> Scissors</h1>
            <p class="subtitle">Pick a move. Outsmart the computer.</p>
        </header>

        <section class="card" id="card" aria-label="Game">

            <!-- Scoreboard -->
            <div class="scoreboard" aria-label="Score">
                <div class="score">
                    <span class="score-label">You</span>
                    <strong id="player-score">0</strong>
                </div>
                <div class="score score-mid">
                    <span class="score-label">Round</span>
                    <strong id="round-count">0</strong>
                </div>
                <div class="score">
                    <span class="score-label">Computer</span>
                    <strong id="computer-score">0</strong>
                </div>
            </div>

            <!-- Battle -->
            <div class="battle" aria-live="polite">
                <div class="hand-box left">
                    <span class="hand-label">You</span>
                    <div class="hand" id="player-choice">❔</div>
                </div>

                <div class="vs-wrap" aria-hidden="true">
                    <span class="burst"></span>
                    <span class="vs">VS</span>
                </div>

                <div class="hand-box right">
                    <span class="hand-label">Computer</span>
                    <div class="hand" id="computer-choice">❔</div>
                </div>
            </div>

            <!-- Result -->
            <div class="result" id="result">
                <h2 id="result-title">Make your move</h2>
                <p id="result-detail">Choose rock, paper or scissors to begin.</p>
            </div>

            <!-- Choices -->
            <div class="choices">
                <button type="button" class="choice-btn" data-choice="rock" aria-label="Choose Rock">
                    <span class="choice-icon">✊</span>
                    <span class="choice-name">Rock</span>
                    <kbd>R</kbd>
                </button>

                <button type="button" class="choice-btn" data-choice="paper" aria-label="Choose Paper">
                    <span class="choice-icon">✋</span>
                    <span class="choice-name">Paper</span>
                    <kbd>P</kbd>
                </button>

                <button type="button" class="choice-btn" data-choice="scissors" aria-label="Choose Scissors">
                    <span class="choice-icon">✌️</span>
                    <span class="choice-name">Scissors</span>
                    <kbd>S</kbd>
                </button>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="winrate">
                    <div class="winrate-top">
                        <span>Win rate</span>
                        <strong id="winrate-text">0%</strong>
                    </div>
                    <div class="bar"><span id="winrate-fill"></span></div>
                </div>

                <div class="streak" id="streak-box">
                    <span class="flame">🔥</span>
                    <div>
                        <span class="streak-label">Streak</span>
                        <strong id="streak-count">0</strong>
                    </div>
                </div>
            </div>

            <button type="button" id="reset-btn" class="ghost-btn">Reset game</button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
