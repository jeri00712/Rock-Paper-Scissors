<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimalist Rock Paper Scissors game built with HTML, CSS and JavaScript.">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="intro">
            <p class="eyebrow">Game</p>
            <h1>Rock Paper Scissors</h1>
            <p class="subtitle">Pick a move. Beat the computer.</p>
        </header>

        <section class="card" aria-label="Game">

            <!-- Scoreboard -->
            <div class="scoreboard" aria-label="Score">
                <div class="score">
                    <span class="score-label">You</span>
                    <strong id="player-score">0</strong>
                </div>
                <div class="score">
                    <span class="score-label">Round</span>
                    <strong id="round-count">0</strong>
                </div>
                <div class="score">
                    <span class="score-label">Computer</span>
                    <strong id="computer-score">0</strong>
                </div>
            </div>

            <!-- Battle -->
            <div class="battle" aria-live="polite">
                <div class="hand-box">
                    <span class="hand-label">You</span>
                    <div class="hand" id="player-choice">❔</div>
                </div>

                <span class="vs" aria-hidden="true">vs</span>

                <div class="hand-box">
                    <span class="hand-label">Computer</span>
                    <div class="hand" id="computer-choice">❔</div>
                </div>
            </div>

            <!-- Result -->
            <div class="result">
                <h2 id="result-title">Make your move</h2>
                <p id="result-detail">Choose rock, paper or scissors to start.</p>
            </div>

            <!-- Choices -->
            <div class="choices">
                <button type="button" class="choice-btn" data-choice="rock" aria-label="Choose Rock">
                    <span class="choice-icon">✊</span>
                    <span class="choice-name">Rock</span>
                    <kbd>R</kbd>
                </button>

                <button type="button" class="choice-btn" data-choice="paper" aria-label="Choose Paper">
                    <span class="choice-icon">✋</span>
                    <span class="choice-name">Paper</span>
                    <kbd>P</kbd>
                </button>

                <button type="button" class="choice-btn" data-choice="scissors" aria-label="Choose Scissors">
                    <span class="choice-icon">✌️</span>
                    <span class="choice-name">Scissors</span>
                    <kbd>S</kbd>
                </button>
            </div>

            <!-- Footer of card -->
            <div class="card-footer">
                <div class="streak">
                    <span>Streak</span>
                    <strong id="streak-count">0</strong>
                </div>
                <button type="button" id="reset-btn" class="ghost-btn">Reset</button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
